[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lot-trader"
version = "0.1.0"
description = "Lot-based Investment Trading Engine & Strategy Automator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
trade = "lot_trader.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

